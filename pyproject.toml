[project]
name = "subjective-logic"
version = "0.1.0"
description = "A Python implementation of Subjective Logic (Jøsang, 2016) for reasoning under uncertainty in agentic AI systems."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
